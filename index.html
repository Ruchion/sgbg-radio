<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz Player</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at 15% 15%, rgba(59, 130, 246, .38), transparent 38%),
            radial-gradient(circle at 85% 85%, rgba(139, 92, 246, .42), transparent 42%),
            linear-gradient(135deg, #07152f 0%, #172d68 45%, #3d176e 100%);
        background-attachment: fixed;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
    }

    .app {
        width: min(760px, 100%);
        padding: 28px 20px 40px;
    }

    .logo {
        display: block;
        max-width: 180px;
        max-height: 90px;
        margin: 0 auto 28px;
        object-fit: contain;
    }

    .logo-placeholder {
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 2px;
        margin: 10px 0 30px;
    }

    .playlists {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
    }

    button {
        border: 1px solid rgba(255,255,255,.16);
        background: rgba(10, 10, 20, .38);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: white;
        border-radius: 10px;
        padding: 15px 16px;
        font-size: 15px;
        cursor: pointer;
        transition: .15s ease;
    }

    button:hover {
        background: rgba(255,255,255,.12);
        border-color: rgba(255,255,255,.32);
    }

    .playlist.active {
        background: rgba(255,255,255,.92);
        color: #111;
        border-color: rgba(255,255,255,.95);
    }

    .add {
        margin-top: 14px;
        width: 100%;
        background: rgba(255,255,255,.06);
        border-style: dashed;
        color: rgba(255,255,255,.72);
    }

    .add:hover { color: white; }

    .player {
        margin-top: 30px;
        padding: 20px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 12px;
        background: rgba(5, 5, 15, .38);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .now-playing {
        color: #aaa;
        font-size: 13px;
        margin-bottom: 12px;
        min-height: 18px;
    }

    audio {
        width: 100%;
    }

    .hint {
        text-align: center;
        color: #666;
        font-size: 12px;
        margin-top: 18px;
    }

    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.72);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal {
        width: min(420px, 100%);
        background: rgba(18, 18, 30, .94);
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 12px;
        padding: 22px;
    }

    .modal h2 {
        margin: 0 0 18px;
        font-size: 20px;
    }

    label {
        display: block;
        color: #aaa;
        font-size: 13px;
        margin: 14px 0 7px;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #383838;
        border-radius: 8px;
        background: #0e0e0e;
        color: white;
        outline: none;
    }

    input:focus { border-color: #777; }

    .modal-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .modal-buttons button { flex: 1; }

    .save {
        background: white;
        color: black;
        border-color: white;
    }

    .save:hover {
        background: #ddd;
    }

    .manage {
        margin-top: 10px;
        width: 100%;
        font-size: 12px;
        color: #777;
        background: transparent;
        border: none;
    }
</style>
</head>

<body>
<div class="app">

    <!--
        LOGO:
        Put a file named "logo.png" next to index.html and change
        SHOW_LOGO to true below.
    -->
    <img id="logo" class="logo" src="logo.png" alt="Logo" style="display:none;">
    <div id="logoPlaceholder" class="logo-placeholder">JAZZ</div>

    <div id="playlists" class="playlists"></div>

    <button class="add" id="addPlaylist">＋ Add Playlist</button>

    <div class="player">
        <div class="now-playing" id="nowPlaying">Select a playlist</div>
        <audio id="audio" controls></audio>
    </div>

    <div class="hint">
        Songs are loaded from each playlist's folder.
    </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <h2 id="modalTitle">Add Playlist</h2>

        <label for="playlistName">Button name</label>
        <input id="playlistName" placeholder="Late Night Jazz">

        <label for="folderName">Folder name</label>
        <input id="folderName" placeholder="late-night">

        <div class="modal-buttons">
            <button id="cancel">Cancel</button>
            <button class="save" id="save">Save</button>
        </div>
    </div>
</div>

<script>
/*
    ============================================================
    JAZZ PLAYER
    ============================================================

    Each playlist is a folder in the same directory as this page.

    Example:

        index.html
        late-night/
            songs.json
            jazz1.mp3
            jazz2.mp3

    songs.json should contain:

        [
            "jazz1.mp3",
            "jazz2.mp3"
        ]

    The playlist button only needs to know:
        - what text to display
        - what folder to use

    Playlists are saved in localStorage, so they remain after
    refreshing the page.
*/

const SHOW_LOGO = false;

// Built-in playlists can be added here if you want.
// You can also leave this empty and use "+ Add Playlist".
const DEFAULT_PLAYLISTS = [
    // { name: "Late Night Jazz", folder: "late-night" },
    // { name: "Smooth Jazz", folder: "smooth-jazz" },
];

const STORAGE_KEY = "jazzPlayerPlaylists";

const playlistsElement = document.getElementById("playlists");
const addButton = document.getElementById("addPlaylist");
const audio = document.getElementById("audio");
const nowPlaying = document.getElementById("nowPlaying");

const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const playlistName = document.getElementById("playlistName");
const folderName = document.getElementById("folderName");
const saveButton = document.getElementById("save");
const cancelButton = document.getElementById("cancel");

let playlists = JSON.parse(localStorage.getItem(STORAGE_KEY));

if (!Array.isArray(playlists) || playlists.length === 0) {
    playlists = DEFAULT_PLAYLISTS.map(p => ({...p, songs: null}));
}

let currentPlaylist = null;
let currentSongs = [];
let remainingSongs = [];
let editingIndex = null;

if (SHOW_LOGO) {
    document.getElementById("logo").style.display = "block";
    document.getElementById("logoPlaceholder").style.display = "none";
}

function savePlaylists() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(playlists));
}

function renderPlaylists() {
    playlistsElement.innerHTML = "";

    playlists.forEach((playlist, index) => {
        const button = document.createElement("button");
        button.className = "playlist";

        if (currentPlaylist === index) {
            button.classList.add("active");
        }

        button.textContent = playlist.name;

        button.addEventListener("click", () => {
            playPlaylist(index);
        });

        // Right click / long press lets you edit a button.
        button.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            editPlaylist(index);
        });

        let pressTimer;

        button.addEventListener("touchstart", () => {
            pressTimer = setTimeout(() => editPlaylist(index), 650);
        }, {passive: true});

        button.addEventListener("touchend", () => {
            clearTimeout(pressTimer);
        });

        button.addEventListener("touchmove", () => {
            clearTimeout(pressTimer);
        });

        playlistsElement.appendChild(button);
    });
}

async function playPlaylist(index) {
    const playlist = playlists[index];

    try {
        let songs = playlist.songs;

        if (!songs) {
            const response = await fetch(
                encodeURI(playlist.folder + "/songs.json"),
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error("Could not load songs.json");
            }

            songs = await response.json();

            if (!Array.isArray(songs) || songs.length === 0) {
                throw new Error("songs.json is empty");
            }

            playlist.songs = songs;
            savePlaylists();
        }

        currentPlaylist = index;
        currentSongs = songs.map(song => playlist.folder + "/" + song);
        remainingSongs = [];

        renderPlaylists();
        playNextSong();

    } catch (error) {
        console.error(error);

        nowPlaying.textContent =
            `Couldn't load "${playlist.folder}/songs.json"`;

        alert(
            `Couldn't load the playlist.\n\n` +
            `Make sure this exists:\n` +
            `${playlist.folder}/songs.json`
        );
    }
}

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function playNextSong() {
    if (!currentSongs.length) return;

    // Once every song has played, create a new random order.
    if (remainingSongs.length === 0) {
        remainingSongs = shuffle(currentSongs);

        // Prevent the last song of one cycle from immediately
        // being the first song of the next cycle when possible.
        if (currentSongs.length > 1 && remainingSongs[0] === audio.dataset.lastSong) {
            [remainingSongs[0], remainingSongs[1]] =
                [remainingSongs[1], remainingSongs[0]];
        }
    }

    const song = remainingSongs.shift();

    audio.dataset.lastSong = song;
    audio.src = encodeURI(song);

    const fileName = decodeURIComponent(song.split("/").pop());

    nowPlaying.textContent = fileName;

    audio.play().catch(() => {
        nowPlaying.textContent =
            `${fileName} — press play to start`;
    });
}

audio.addEventListener("ended", playNextSong);

addButton.addEventListener("click", () => {
    editingIndex = null;
    modalTitle.textContent = "Add Playlist";
    playlistName.value = "";
    folderName.value = "";
    modalBackdrop.style.display = "flex";
    playlistName.focus();
});

function editPlaylist(index) {
    editingIndex = index;

    const playlist = playlists[index];

    modalTitle.textContent = "Edit Playlist";
    playlistName.value = playlist.name;
    folderName.value = playlist.folder;

    modalBackdrop.style.display = "flex";
    playlistName.focus();
}

saveButton.addEventListener("click", () => {
    const name = playlistName.value.trim();
    const folder = folderName.value.trim();

    if (!name || !folder) {
        alert("Enter both a button name and folder name.");
        return;
    }

    if (editingIndex === null) {
        playlists.push({
            name,
            folder,
            songs: null
        });
    } else {
        playlists[editingIndex].name = name;
        playlists[editingIndex].folder = folder;

        // Force songs.json to be reloaded if the folder changed.
        playlists[editingIndex].songs = null;
    }

    savePlaylists();
    renderPlaylists();
    closeModal();
});

cancelButton.addEventListener("click", closeModal);

modalBackdrop.addEventListener("click", (event) => {
    if (event.target === modalBackdrop) {
        closeModal();
    }
});

function closeModal() {
    modalBackdrop.style.display = "none";
    editingIndex = null;
}

renderPlaylists();
</script>
</body>
</html>
